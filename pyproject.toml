[project]
name = "se-agents"
version = "0.1.0"
description = "Blackboard-driven multi-agent software proposal workshop"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.66.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
se-agents = "se_agents.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/se_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".bootstrap", ".cache", ".python", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
